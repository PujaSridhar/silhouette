[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette"
version = "0.1.0"
description = "A styling reasoning engine: solver for structure, model for taste."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Puja Sridhar" }]
keywords = ["styling", "constraint-programming", "explainable-ai", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
solver = ["ortools>=9.8"]
dev = ["pytest>=8.0"]
# W1. `vision` measures volume from masks and trains/evaluates the segmenter;
# `sam` adds SAM 2 for hand-annotating her own photos. Neither is needed for
# the engine itself.
vision = ["pillow>=10.0", "pillow-heif>=0.16", "torch>=2.2", "transformers>=4.44", "scipy>=1.11"]
# Meta's SAM 2 from its own repository. The `sam2` name on PyPI is a
# third-party upload, not Meta's, so it is deliberately not used.
sam = ["pillow>=10.0", "pillow-heif>=0.16", "sam2 @ git+https://github.com/facebookresearch/sam2.git"]

[project.scripts]
silhouette = "silhouette.cli:main"
silhouette-vision = "silhouette.vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
